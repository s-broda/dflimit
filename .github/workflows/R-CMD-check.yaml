# R CMD check on Windows, macOS and Linux with the current R release.
# Runs on a push to main that changes the package (code, C sources, tests, documentation pages, build files or this
# file; a push that changes only the README, the news or other prose starts nothing), and when started by hand
# (Actions tab, "Run workflow").
name: R-CMD-check

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'man/**'
      - 'inst/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rbuildignore'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R release)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_LIMIT_CORES_: "TRUE"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: false
# by hand: gh workflow run R-CMD-check.yaml
